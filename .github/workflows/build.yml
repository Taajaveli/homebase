name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk homebase.apk

      - uses: actions/upload-artifact@v4
        with:
          name: homebase-apk
          path: homebase.apk

      # Keeps one always-current download link:
      # https://github.com/<you>/<repo>/releases/download/latest/homebase.apk
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest homebase.apk \
            --title "Homebase (latest)" \
            --notes "Built from ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
